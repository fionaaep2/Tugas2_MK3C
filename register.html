<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrasi</title>
<link rel="stylesheet" href="register.css">

</style>

</head>
<body>
<div class="container">

<h2>Registrasi</h2>

<form>

<label for="nama">Nama Lengkap:</label>
<input type="text" id="nama" placeholder="Masukkan Nama Lengkap">

<label for="username">Username:</label>
<input type="text" id="username" placeholder="Masukkan Username">

<label for="email">Email:</label>
<input type="email" id="email" placeholder="Masukkan Email">

<label for="password">Kata Sandi:</label>
<input type="password" id="password" placeholder="Masukkan Password">

<label for="konfirmasi">Konfirmasi Kata Sandi:</label>
<input type="password" id="konfirmasi" placeholder="Konfirmasi Kata Sandi">

<label for="tanggal">Tanggal Lahir:</label>
<input type="date" id="tanggal">

<label>Jenis Kelamin:</label>

<label for="laki">Laki-laki</label>
<input type="radio" id="laki" name="jenis_kelamin" value="Laki-laki">

<label for="perempuan">Perempuan</label>
<input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan">

<label for="kelas">Kelas:</label>
<select id="kelas">
    <option>-- Pilih Kelas --</option>
    <option>XI PPLG 3</option>
    <option>XI PPLG 4</option>
    <option>XI PPLG 5</option>
</select>

<label for="alamat">Alamat:</label>
<input type="text" id="alamat" placeholder="Masukkan Alamat">

<button type="submit">Daftar</button>

<p>Sudah memiliki akun? <a href="login.html">Login</a></p>

</form>

</div>

</body>
</html>
